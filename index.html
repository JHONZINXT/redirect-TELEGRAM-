<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aguarde… preparando seu acesso</title>
  <meta name="description" content="Validando seus dados e liberando o acesso ao Telegram com segurança." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    :root{
      --bg:#070b14; --card:#0d1324; --fg:#eaf1ff; --muted:#9db0c9;
      --brand:#3b82f6; --brand-2:#60a5fa; --ok:#10b981;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
      color:var(--fg);
      background:
        radial-gradient(1000px 600px at 10% -10%, #182248, #070b14) fixed,
        linear-gradient(#0b1120,#0b1120) fixed;
    }

    /* Layout */
    .wrap{min-height:100%; display:grid; place-items:center; padding:16px}
    .card{
      width:100%; max-width:520px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      border-radius:20px;
      box-shadow:0 18px 60px rgba(0,0,0,.45);
      padding:20px 18px 22px;
    }

    /* Texto */
    h1{
      font-size:clamp(18px, 5vw, 24px);
      line-height:1.25; margin:0 0 8px; text-align:center;
    }
    p{margin:6px 0; color:var(--muted); text-align:center}

    /* Status */
    .stage{display:flex; align-items:center; justify-content:center; gap:10px; margin:10px 0 6px}
    .dot{width:10px; height:10px; border-radius:50%; background:var(--brand);
      box-shadow:0 0 0 0 rgba(59,130,246,.7); animation:pulse 1.4s infinite}
    @keyframes pulse{to{box-shadow:0 0 0 14px rgba(59,130,246,0)}}

    /* Barra de progresso */
    .bar{position:relative; height:12px; background:rgba(255,255,255,.09);
      border-radius:999px; overflow:hidden; margin:12px 0 4px}
    .bar > i{position:absolute; inset:0; width:0%;
      background:linear-gradient(90deg, var(--brand), var(--brand-2));
      border-radius:inherit; transition:width .2s ease}
    .bar > i::after{content:""; position:absolute; inset:0;
      background:linear-gradient(90deg, rgba(255,255,255,.30), rgba(255,255,255,0));
      filter:blur(6px)}

    .timer{font-weight:700; letter-spacing:.2px}

    /* CTA */
    .cta{margin-top:16px; display:grid; place-items:center}
    .btn{
      appearance:none; border:0; border-radius:14px;
      padding:16px 18px; width:min(420px, 100%);
      font-weight:800; letter-spacing:.2px; text-transform:none;
      background:var(--brand); color:#fff;
      box-shadow:0 10px 24px rgba(59,130,246,.35);
      transition:transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .btn:disabled{opacity:.65; cursor:not-allowed}
    .btn:not(:disabled):hover{transform:translateY(-1px)}

    /* Melhorias mobile */
    @media (max-width:420px){
      .card{padding:18px 14px 20px}
      .bar{height:11px}
      .btn{padding:15px 16px; border-radius:12px}
    }
    @media (prefers-color-scheme:light){
      :root{--bg:#f6f8ff; --card:#ffffff; --fg:#0b1220; --muted:#516078}
      body{background:#eef2ff}
      .card{border-color:#e6ebff}
    }
  </style>

  <!-- META PIXEL -->
  <script>
    (function(f,b,e,v,n,t,s){
      if(f.fbq) return; n=f.fbq=function(){n.callMethod? n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq) f._fbq=n; n.push=n; n.loaded=!0; n.version='2.0';
      n.queue=[]; t=b.createElement(e); t.async=!0; t.src=v; s=b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t,s)
    })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '2010710579683970');     // seu Pixel
    fbq('track', 'PageView');

    // 🔒 Garante persistência imediata do _fbp antes do redirecionamento
    setTimeout(() => {
      try {
        const fbpCookie = document.cookie.split('; ').find(x => x.startsWith('_fbp='))?.split('=')[1];
        if (fbpCookie) {
          localStorage.setItem('_fbp', fbpCookie);
          document.cookie = `_fbp=${fbpCookie}; path=/; max-age=31536000; SameSite=None; Secure`;
        }
      } catch (e) {
        console.warn('Falha ao fixar cookie _fbp:', e);
      }
    }, 1200);
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" alt=""
         src="https://www.facebook.com/tr?id=2010710579683970&ev=PageView&noscript=1" />
  </noscript>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main" aria-live="polite">
      <h1>Preparando seu acesso ao Telegram</h1>

      <div class="stage">
        <span class="dot" aria-hidden="true"></span>
        <p id="stage-txt">Validando dados de campanha…</p>
      </div>

      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <p class="timer"><span id="seconds">4</span>s para liberar o acesso</p>

      <div class="cta">
        <button class="btn" id="btn-ir" disabled>Ir para o Telegram agora</button>
      </div>
    </main>
  </div>

<script>
  // ========= CLOAKER NA VERCEL (antes de tudo) =========
  (function () {
    const ref = (document.referrer || '').toLowerCase();
    const qs0 = new URLSearchParams(location.search);

    const fbclid0 = qs0.get('fbclid');
    const utm0 =
      qs0.get('utm_source') ||
      qs0.get('utm_medium') ||
      qs0.get('utm_campaign') ||
      qs0.get('utm_content') ||
      qs0.get('utm_term');

    const fbpCookie0 = document.cookie.includes('_fbp=');

    const looksLikeAdTraffic0 = fbclid0 || utm0 || fbpCookie0;

    // Se veio da Biblioteca de Anúncios da Meta, joga para página fake
    // (só quando NÃO parece tráfego real de anúncio)
    if (ref.includes('facebook.com/ads/library') && !looksLikeAdTraffic0) {
      console.log('[CLOAK] Tráfego da Ad Library (sem sinais de anúncio) → redirecionando para página neutra');
      const fallbackUrl = 'https://t.me/anajuliaoficial_bot';
      window.location.replace(fallbackUrl);
    }
  })();

  /* ========= CONFIG ========= */
  const REDIRECTOR    = 'https://pixup.ninjabet.site/go/telegram';
  const BOT_FALLBACK = 'https://google.com'; // ← fallback neutro temporário
  const AUTO_DELAY_MS = 4200;

  /* ========= HELPERS ========= */
  const qs = new URLSearchParams(location.search);
  const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
  const getParam = (k, def='') => qs.get(k) || def;

  // --- cookie helpers (1P) ---
  const getCookie = (k) => document.cookie.split('; ').find(x=>x.startsWith(k+'='))?.split('=')[1] || '';
  const setCookie = (k,v,maxDays=14) => {
    const d = new Date(Date.now() + maxDays*864e5).toUTCString();
    document.cookie = `${k}=${v}; path=/; expires=${d}; SameSite=Lax`;
  };

  const botId = getParam('bot_id', 'bot1');

  // --- gera ou reaproveita um eventID estável ---
  const mkId = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
  let lead_uuid = getCookie('_eid');
  if (!lead_uuid) { lead_uuid = mkId(); setCookie('_eid', lead_uuid); }

  // lê o _fbp do navegador (cookie do Pixel) com fallback do localStorage
  const fbpCookie = getCookie('_fbp') || localStorage.getItem('_fbp') || '';

  const payload = {
    fbclid:       getParam('fbclid',''),
    fbp:          fbpCookie,
    utm_source:   getParam('utm_source','meta'),
    utm_medium:   getParam('utm_medium','paid'),
    utm_campaign: getParam('utm_campaign',''),
    utm_content:  getParam('utm_content',''),
    utm_term:     getParam('utm_term','')
  };
  const toQuery = (obj) =>
    Object.entries(obj)
      .filter(([,v])=>v!==undefined && v!=='')
      .map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
      .join('&');

  // vamos definir redirectUrl depois de buscar o IP
  let redirectUrl = `${REDIRECTOR}?${toQuery({ ...payload, lead_uuid })}`;

  const bar = document.getElementById('bar');
  const secondsEl = document.getElementById('seconds');
  const stageTxt = document.getElementById('stage-txt');
  const btnIr = document.getElementById('btn-ir');

  const fbReady = ()=> typeof fbq === 'function' && fbq.callMethod;

  (async () => {
    // tenta obter o IP visto pelo backend para enviar como fbi
    let fbi = '';
    try {
      const r = await fetch('https://pixup.ninjabet.site/api/ip', { method: 'GET' });
      const j = await r.json();
      if (j?.ip) fbi = j.ip;
    } catch (_) {}

    // espera um pouco para o _fbp existir (como você já fazia)
    let fbpNow = getCookie('_fbp') || localStorage.getItem('_fbp') || payload.fbp || '';
    if (!fbpNow) {
      const t0 = Date.now();
      while (!fbpNow && (Date.now() - t0) < 1500) {
        await sleep(100);
        fbpNow = getCookie('_fbp') || localStorage.getItem('_fbp') || '';
      }
    }

    // ========= FILTRO DE TRÁFEGO (ANTI-CLONE) =========
    const hasFbclid = !!getParam('fbclid','');

    const hasUtm =
      !!getParam('utm_source','') ||
      !!getParam('utm_medium','') ||
      !!getParam('utm_campaign','') ||
      !!getParam('utm_content','') ||
      !!getParam('utm_term','');

    // ✅ Importante: NÃO usar _fbp como “sinal de anúncio”
    // porque ele pode ser criado até em acesso direto.
    const looksLikeAdTraffic = hasFbclid || hasUtm;

    // Se NÃO parece tráfego real de anúncio → fallback (sem quebrar cliques reais)
    if (!looksLikeAdTraffic) {
      console.log('[CLOAK] Acesso direto sem sinais de anúncio → fallback');
      window.location.replace(BOT_FALLBACK);
      return;
    }

    // após obter o IP (se existir), montamos a URL final com fbi
    const payloadNow = { ...payload, fbp: fbpNow };
    redirectUrl = `${REDIRECTOR}?${toQuery({ ...payloadNow, lead_uuid, fbi, bot_id: botId })}`;

    // Progresso suave + contador
    const start = Date.now();
    const tick = setInterval(()=>{
      const t = Date.now() - start;
      const p = Math.min(1, t / AUTO_DELAY_MS);
      bar.style.width = (p*100).toFixed(1) + '%';
      const secs = Math.max(0, Math.ceil((AUTO_DELAY_MS - t)/1000));
      secondsEl.textContent = secs.toString();
    }, 1000/30);

    // Aguarda pixel ou metade do tempo
    let waited = 0;
    while(!fbReady() && waited < AUTO_DELAY_MS * 0.5){
      await sleep(100);
      waited += 100;
    }

    // Dispara ViewContent com eventID de dedupe
    try{
      if (fbReady()){
        stageTxt.textContent = 'Verificando…';
        fbq('track', 'ViewContent', { content_category: 'telegram_bridge' }, { eventID: lead_uuid });
      }
    }catch(_){}

    // Garante tempo mínimo
    const remain = AUTO_DELAY_MS - (Date.now() - start);
    if (remain > 0) await sleep(remain);

    clearInterval(tick);
    bar.style.width = '100%';
    secondsEl.textContent = '0';
    btnIr.disabled = false;
    stageTxt.textContent = 'Tudo pronto!';
    setTimeout(() => { go(); }, 250);
  })();

  // CTA
  function go(){
    try{ location.href = redirectUrl; }
    catch(_){ location.href = `${BOT_FALLBACK}?start=lead_${lead_uuid}`; }
  }
  btnIr.addEventListener('click', go);
</script>
</body>
</html>
